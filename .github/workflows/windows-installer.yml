# Builds the Windows installers (.exe and .msi) on demand, WITHOUT creating a tag or a release.
# Start it from GitHub: Actions tab > "Windows installer" > Run workflow. Then download the
# "windows" zip from the finished run (Artifacts, at the bottom) and share the file yourself.
# The Windows steps are the same as the "windows" job in release.yml.
name: Windows installer
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.1 (digits and dots only)"
        required: true
        default: "1.0.0"

env:
  GITHUB_REPO: ${{ github.repository }}
  # Passed through the environment, never pasted into a script, so the input cannot inject commands.
  APP_VERSION: ${{ inputs.version }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check the version
        shell: pwsh
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Version must look like 1.0.1" }
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter gen-l10n
      - name: Build
        shell: bash
        run: >
          flutter build windows --release
          --dart-define=GITHUB_REPO=$GITHUB_REPO
          --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          --dart-define=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
      - name: Installer (.exe)
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" windows\installer\atia.iss
          $f = "build\installer\Atia-Setup-$v.exe"
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  Atia-Setup-$v.exe" | Out-File "$f.sha256" -Encoding ascii
      - name: Installer (.msi)
        # The .msi build is new and untested: if it fails, still upload the .exe.
        continue-on-error: true
        shell: pwsh
        run: |
          $v = $env:APP_VERSION
          dotnet tool install --global wix --version 5.0.2
          wix build -arch x64 -d AppVersion=$v -d BuildDir=build\windows\x64\runner\Release `
            -sice ICE38 -sice ICE64 -sice ICE91 `
            -o "build\installer\Atia-$v.msi" windows\installer\atia.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed" }
          $f = "build\installer\Atia-$v.msi"
          (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  Atia-$v.msi" | Out-File "$f.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/installer/*.exe
            build/installer/*.msi
            build/installer/*.sha256
